name: Content batch automation

on:
  workflow_dispatch:
    inputs:
      candidate_count:
        description: Candidate count (10-150)
        required: true
        default: "100"
      snapshot_date:
        description: Optional UTC snapshot date (YYYY-MM-DD)
        required: false
      batch_id:
        description: Optional deterministic batch ID
        required: false
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: content-batch-main
  cancel-in-progress: false

jobs:
  content-build:
    if: github.event_name == 'workflow_dispatch' || vars.CONTENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      snapshot_date: ${{ steps.context.outputs.snapshot_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: context
        name: Pin immutable run context
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.snapshot_date }}
        run: |
          set -euo pipefail
          snapshot_date="${INPUT_DATE:-$(date -u +%F)}"
          [[ "$snapshot_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "base_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=${snapshot_date}" >> "$GITHUB_OUTPUT"
          echo "SNAPSHOT_DATE=${snapshot_date}" >> "$GITHUB_ENV"
          echo "BATCH_ID=${{ inputs.batch_id || format('v2-11-batch-{0}', github.run_id) }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify provider secret names without printing values
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          test -n "$TWITCH_CLIENT_ID" && echo "TWITCH_CLIENT_ID=SET" || echo "TWITCH_CLIENT_ID=MISSING"
          test -n "$TWITCH_CLIENT_SECRET" && echo "TWITCH_CLIENT_SECRET=SET" || echo "TWITCH_CLIENT_SECRET=MISSING"
      - name: Plan and validate locally
        run: npm run content:batch:plan -- --batch-id "$BATCH_ID" --count "${{ inputs.candidate_count || '100' }}" --snapshot-date "$SNAPSHOT_DATE" --dry-run --json
      - run: npm run typecheck && npm run lint && npm run site:data:check && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: content-batch-summary
          path: /tmp/gamehub-content-batch-summary.json

  open-pr:
    needs: content-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main did not move
        env:
          BASE_SHA: ${{ needs.content-build.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: content-batch-summary
          path: /tmp/content-batch-summary
      - name: Require reviewed publication artifact
        run: test -s /tmp/content-batch-summary/gamehub-content-batch-summary.json
